
<!DOCTYPE html>
<html lang="en">
<head>
   
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Online Shopping</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: whitesmoke;
            color: black;
        }

        /* Navigation Bar */
        header {
            background: midnightblue;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: orange;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 22px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        nav a:hover {
            color: orange;
        }

        .cart {
            background: orange;
            color: midnightblue;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Search Bar */
        .search-box {
            display: flex;
            justify-content: center;
            padding: 20px;
            background: white;
            gap: 8px;
        }

        .search-box input {
            width: 60%;
            max-width: 550px;
            padding: 12px;
            border: 1px solid silver;
            border-radius: 5px;
            font-size: 15px;
        }

        .search-box button {
            background: orange;
            color: black;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Promotional Banner */
        .banner {
            margin: 25px 6%;
            padding: 55px 35px;
            border-radius: 12px;
            background: linear-gradient(
                120deg,
                midnightblue,
                steelblue
            );
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .banner h1 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .banner p {
            margin-bottom: 22px;
            line-height: 1.6;
        }

        .banner button {
            padding: 12px 22px;
            border: none;
            border-radius: 5px;
            background: orange;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        .banner img {
            width: 220px;
            max-width: 35%;
            border-radius: 12px;
        }

        /* Categories */
        .categories {
            padding: 15px 6%;
        }

        .categories h2,
        .products-section h2 {
            margin-bottom: 20px;
        }

        .category-list {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .category {
            background: white;
            color: black;
            padding: 13px 20px;
            border-radius: 25px;
            border: 1px solid lightgray;
            cursor: pointer;
        }

        .category:hover,
        .category.active {
            background: midnightblue;
            color: white;
        }

        /* Products Grid */
        .products-section {
            padding: 30px 6%;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 22px;
        }

        .product-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 12px lightgray;
            transition: transform 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-image {
            position: relative;
            background: lightgray;
        }

        .product-image img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            display: block;
        }

        .discount {
            position: absolute;
            top: 12px;
            left: 12px;
            background: crimson;
            color: white;
            padding: 6px 9px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .product-info {
            padding: 16px;
        }

        .product-info h3 {
            font-size: 17px;
            margin-bottom: 9px;
        }

        .rating {
            color: goldenrod;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .description {
            color: dimgray;
            font-size: 13px;
            line-height: 1.5;
            min-height: 40px;
            margin-bottom: 12px;
        }

        .price {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .old-price {
            color: gray;
            font-size: 14px;
            text-decoration: line-through;
            margin-left: 7px;
            font-weight: normal;
        }

        .add-cart {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: midnightblue;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .add-cart:hover {
            background: orange;
            color: midnightblue;
        }

        .empty-message {
            grid-column: 1 / -1;
            padding: 30px;
            text-align: center;
            color: dimgray;
        }

        /* Footer */
        footer {
            background: midnightblue;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 30px;
        }

        footer p {
            margin: 6px;
        }

        /* Responsive Design */
        @media (max-width: 1000px) {
            .products {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .banner h1 {
                font-size: 30px;
            }
        }

        @media (max-width: 700px) {
            header {
                justify-content: center;
            }

            nav {
                justify-content: center;
            }

            .products {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .banner {
                padding: 30px 20px;
            }

            .banner img {
                width: 140px;
            }

            .banner h1 {
                font-size: 25px;
            }

            .search-box input {
                width: 70%;
            }
        }

        @media (max-width: 420px) {
            .products {
                grid-template-columns: 1fr;
            }

            .banner img {
                display: none;
            }

            .product-image img {
                height: 250px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <div class="logo">ShopEase.</div>

        <nav>
            <a href="#home">Home</a>
            <a href="#categories">Categories</a>
            <a href="#products">Products</a>
            <a href="#footer">Contact</a>

            <div class="cart" onclick="showCart()">
                🛒 Cart (<span id="cart-count">0</span>)
            </div>
        </nav>
    </header>

    <!-- Search Bar -->
    <div class="search-box">
        <input
            type="text"
            id="search"
            placeholder="Search products..."
            oninput="renderProducts()">

        <button onclick="renderProducts()">Search</button>
    </div>

    <!-- Promotional Banner -->
    <section class="banner" id="home">
        <div>
            <h1>Big Shopping Days!</h1>

            <p>
                Discover amazing products at amazing prices.<br>
                Get up to 50% OFF on selected products.
            </p>

            <button onclick="document.getElementById('products')
                .scrollIntoView({behavior:'smooth'})">
                Shop Now →
            </button>
        </div>

        <img
            src="https://images.unsplash.com/photo-1607082349566-187342175e2f?auto=format&fit=crop&w=500&q=80"
            alt="Shopping offers">
    </section>

    <!-- Categories -->
    <section class="categories" id="categories">
        <h2>Shop by Category</h2>

        <div class="category-list">
            <button class="category active"
                onclick="selectCategory('All', this)">
                All
            </button>

            <button class="category"
                onclick="selectCategory('Electronics', this)">
                Electronics
            </button>

            <button class="category"
                onclick="selectCategory('Fashion', this)">
                Fashion
            </button>

            <button class="category"
                onclick="selectCategory('Footwear', this)">
                Footwear
            </button>

            <button class="category"
                onclick="selectCategory('Accessories', this)">
                Accessories
            </button>
        </div>
    </section>

    <!-- Products -->
    <section class="products-section" id="products">
        <h2>Featured Products</h2>
        <div class="products" id="product-list"></div>
    </section>

    <!-- Footer -->
    <footer id="footer">
        <h2>ShopEase.</h2>
        <p>Your everyday shopping destination.</p>
        <p>© 2026 ShopEase. All rights reserved.</p>
    </footer>

    <script>
        const products = [
            {
                id: 1,
                name: "Wireless Headphones",
                category: "Electronics",
                price: 1499,
                oldPrice: 2499,
                rating: 4.5,
                discount: 40,
                description: "Enjoy clear sound and comfortable listening.",
                image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80"
            },
            {
                id: 2,
                name: "Premium Wrist Watch",
                category: "Accessories",
                price: 1999,
                oldPrice: 2999,
                rating: 4.3,
                discount: 33,
                description: "A stylish watch for a modern, premium look.",
                image: "https://images.unsplash.com/photo-1524592094714-0f0654e20314?auto=format&fit=crop&w=500&q=80"
            },
            {
                id: 3,
                name: "Casual Sneakers",
                category: "Footwear",
                price: 1799,
                oldPrice: 2999,
                rating: 4.6,
                discount: 40,
                description: "Comfortable everyday shoes with a trendy design.",
                image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=80"
            },
            {
                id: 4,
                name: "Classic Men's Jacket",
                category: "Fashion",
                price: 2499,
                oldPrice: 3999,
                rating: 4.4,
                discount: 38,
                description: "Upgrade your wardrobe with a classic jacket.",
                image: "https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=500&q=80"
            },
            {
                id: 5,
                name: "Smartphone",
                category: "Electronics",
                price: 14999,
                oldPrice: 17999,
                rating: 4.5,
                discount: 17,
                description: "A sleek smartphone for everyday tasks.",
                image: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=500&q=80"
            },
            {
                id: 6,
                name: "Stylish Backpack",
                category: "Accessories",
                price: 899,
                oldPrice: 1499,
                rating: 4.2,
                discount: 40,
                description: "A practical bag for college and travel.",
                image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=500&q=80"
            },
            {
                id: 7,
                name: "Classic T-Shirt",
                category: "Fashion",
                price: 599,
                oldPrice: 999,
                rating: 4.1,
                discount: 40,
                description: "A versatile T-shirt with a comfortable fit.",
                image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=500&q=80"
            },
            {
                id: 8,
                name: "Running Shoes",
                category: "Footwear",
                price: 2199,
                oldPrice: 3499,
                rating: 4.7,
                discount: 37,
                description: "Lightweight footwear for an active lifestyle.",
                image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=80"
            }
        ];

        let selectedCategory = "All";
        let cart = [];

        // Display Products
        function renderProducts() {
            const searchText = document
                .getElementById("search")
                .value.toLowerCase();

            const filtered = products.filter(product => {
                const matchesCategory =
                    selectedCategory === "All" ||
                    product.category === selectedCategory;

                const matchesSearch =
                    product.name.toLowerCase().includes(searchText) ||
                    product.category.toLowerCase().includes(searchText);

                return matchesCategory && matchesSearch;
            });

            const productList =
                document.getElementById("product-list");

            if (filtered.length === 0) {
                productList.innerHTML =
                    '<p class="empty-message">No products found.</p>';
                return;
            }

            productList.innerHTML = filtered.map(product => `
                <div class="product-card">
                    <div class="product-image">
                        <span class="discount">
                            ${product.discount}% OFF
                        </span>

                        <img
                            src="${product.image}"
                            alt="${product.name}"
                            loading="lazy">
                    </div>

                    <div class="product-info">
                        <h3>${product.name}</h3>

                        <div class="rating">
                            ★ ${product.rating} / 5
                        </div>

                        <p class="description">
                            ${product.description}
                        </p>

                        <div class="price">
                            ₹${product.price.toLocaleString("en-IN")}

                            <span class="old-price">
                                ₹${product.oldPrice.toLocaleString("en-IN")}
                            </span>
                        </div>

                        <button class="add-cart"
                            onclick="addToCart(${product.id})">
                            Add to Cart
                        </button>
                    </div>
                </div>
            `).join("");
        }

        // Category Filter
        function selectCategory(category, button) {
            selectedCategory = category;

            document.querySelectorAll(".category").forEach(item => {
                item.classList.remove("active");
            });

            button.classList.add("active");
            renderProducts();
        }

        // Add Products to Cart
        function addToCart(id) {
            const product = products.find(item => item.id === id);

            cart.push(product);

            document.getElementById("cart-count").textContent =
                cart.length;

            alert(product.name + " added to your cart!");
        }

        // Display Cart
        function showCart() {
            if (cart.length === 0) {
                alert("Your shopping cart is empty!");
                return;
            }

            const total = cart.reduce(
                (sum, product) => sum + product.price,
                0
            );

            const items = cart.map(product =>
                product.name + " - ₹" +
                product.price.toLocaleString("en-IN")
            ).join("\n");

            alert(
                "YOUR SHOPPING CART\n\n" +
                items +
                "\n\nTotal: ₹" +
                total.toLocaleString("en-IN") +
                "\n\nDemo only: checkout is not connected."
            );
        }

        // Load Products
        renderProducts();
    </script>

</body>
</html>
